<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Songify</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ebe8dd">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="Tamil songs, endless.">
<link rel="icon" href="assets/favicon.png" type="image/png" sizes="256x256">
<link rel="icon" href="assets/favicon-48.png" type="image/png" sizes="48x48">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Russo+One&display=swap">
<script>try{var t=JSON.parse(localStorage.getItem("sf_theme")||"null")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="light"}</script>
<style>
:root{--bg:#ebe8dd;--panel:#f6f3e8;--card:#fffdf6;--text:#1a1208;--mute:#6c604b;--line:#1a1208;--shadow:#1a1208;--hover:#e2ddcc;--hot:#d63f00;--barbg:#150e06;
--l1:#ffd21f;--l2:#ff9a00;--l3:#ff4a12;--lava:linear-gradient(160deg,#ffd21f 0%,#ff9a00 45%,#ff4a12 100%);--cracks:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22240%22 height=%22240%22 viewBox=%220 0 240 240%22 fill=%22none%22 stroke=%22%231a1208%22 stroke-opacity=%22.38%22 stroke-width=%221.3%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M12 30l22 14-6 24 26 12M54 80l-8 28 20 10M150 14l-14 26 24 10-8 30M160 80l30 8 12 30M196 40l22-6M20 150l26-10 12 26-18 20M100 120l22 18-6 28 30 8M180 160l24 16-4 26M64 216l10-22 28-4M214 108l16-8M130 200l22-6 6 24M6 98l16 4%22/%3E%3Cpath d=%22M86 52l6 3M118 80l5-3M30 110l4 5M176 120l6-4M110 20l5 4M228 70l5 5M72 150l-5 6M198 214l6-4M140 150l5 4M44 190l-6 3%22 stroke-width=%222.2%22 stroke-opacity=%22.3%22/%3E%3C/svg%3E");--ease:cubic-bezier(.2,.8,.2,1);color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0d0803;--panel:#17100a;--card:#22170d;--text:#fff1d6;--mute:#b6a283;--line:#46321a;--shadow:#000;--hover:#2c1e10;--hot:#ffb21f;--barbg:#100a04;color-scheme:dark}
*{box-sizing:inherit;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:500 14px/1.45 Manrope,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%22160%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%22.8%22 numOctaves=%222%22 stitchTiles=%22stitch%22/%3E%3CfeColorMatrix values=%220 0 0 0 .1 0 0 0 0 .07 0 0 0 0 .03 0 0 0 .6 0%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22/%3E%3C/svg%3E");opacity:.08;pointer-events:none;z-index:50;mix-blend-mode:multiply}
:root[data-theme="dark"] body::before{opacity:.18;mix-blend-mode:screen}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--l3);outline-offset:2px}
h1,h2,.hi,.btn,.tile,.nv.on{font-family:"Russo One",Manrope,sans-serif;font-weight:400}
#app{display:grid;grid-template-columns:270px 1fr;grid-template-rows:1fr 88px;gap:14px;padding:14px;height:100%;position:relative}
.panel{background:var(--panel);border:2.5px solid var(--line);border-radius:16px;box-shadow:5px 5px 0 var(--shadow);overflow:hidden}
#side{grid-row:1;display:flex;flex-direction:column;gap:14px;min-height:0}
#nav{padding:14px 10px}
.logo{position:relative;overflow:hidden;padding:2px 4px 14px;animation:drop .9s var(--ease) both}
.logo .lg{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 0 #0003)}
.logo::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,#fff9 50%,transparent 60%);transform:translateX(-120%);animation:shine 6s 1.6s ease-in-out infinite}
@keyframes drop{0%{transform:translateY(-40px) rotate(-6deg);opacity:0}55%{transform:translateY(6px) rotate(2deg);opacity:1}75%{transform:translateY(-3px) rotate(-1deg)}100%{transform:none}}
@keyframes shine{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.spk{position:absolute;width:16px;height:16px;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:tw 2.6s ease-in-out infinite;pointer-events:none;z-index:2}
.logo .spk.a{top:18%;right:8%}.logo .spk.b{bottom:30%;left:6%;width:11px;height:11px;animation-delay:-1.2s}
@keyframes tw{0%,100%{transform:scale(.2) rotate(0);opacity:0}50%{transform:scale(1) rotate(45deg);opacity:1}}
.nv{display:flex;align-items:center;gap:14px;width:100%;padding:11px 14px;border-radius:12px;color:var(--mute);font-weight:700;border:2.5px solid transparent;transition:transform .2s var(--ease),color .2s,background .2s}
.nv:hover{color:var(--text);background:var(--hover)}
.nv.on{color:#1a1208;background:var(--cracks),var(--lava);border-color:var(--line);box-shadow:3px 3px 0 var(--shadow)}
.nv:active{transform:translate(2px,2px)}
#lib{flex:1;padding:14px 10px;overflow:auto}
#lib h3{padding:4px 12px 10px;color:var(--mute);font-size:12px;font-weight:800;letter-spacing:.04em}
.li{display:flex;gap:12px;align-items:center;padding:7px 8px;border-radius:12px;width:100%;text-align:left;transition:background .2s}
.li:hover{background:var(--hover)}
.li .cv{width:44px;height:44px;border-radius:8px;font-size:18px}
.yb{padding:14px 12px;color:var(--mute);font-size:11px}
#main{grid-column:2;grid-row:1;overflow-y:auto;position:relative;scroll-behavior:smooth;border-radius:16px}
.in{position:relative;padding:26px 28px 44px}
h1{font-size:30px;letter-spacing:.2px;margin-bottom:18px;line-height:1.15}
h2{font-size:21px;margin:30px 0 14px;letter-spacing:.2px}
.hero2{position:relative;overflow:hidden;border-radius:18px;padding:28px 30px 30px;margin:34px 0 24px;background:var(--cracks),var(--lava);border:2.5px solid var(--line);box-shadow:6px 6px 0 var(--shadow);color:#1a1208}
.hero2 .hi{font-size:14px;opacity:.85;margin-bottom:6px}
.hero2 h1{font-size:44px;margin:0 0 8px;color:#1a1208;text-shadow:2px 0 #fff,-2px 0 #fff,0 2px #fff,0 -2px #fff,2px 2px #fff,-2px -2px #fff,2px -2px #fff,-2px 2px #fff,4px 5px 0 #1a120855}
.hero2 p{font-weight:700;max-width:420px}
.hero2 .spk.a{top:18px;right:15%;width:26px;height:26px}.hero2 .spk.b{bottom:22px;right:30%;animation-delay:-.9s}.hero2 .spk.c{top:46%;right:6%;width:12px;height:12px;animation-delay:-1.7s}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.qk{display:flex;align-items:center;gap:12px;background:var(--card);border:2.5px solid var(--line);border-radius:12px;box-shadow:4px 4px 0 var(--shadow);overflow:hidden;text-align:left;font-weight:800;padding-right:12px;transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.qk .cv{width:56px;height:56px;border-radius:0;border-right:2.5px solid var(--line)}
.qk:hover{transform:translate(-2px,-3px);box-shadow:7px 8px 0 var(--shadow)}
.qk:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:178px;gap:18px;overflow-x:auto;padding:4px 8px 14px 2px;scrollbar-width:none}
.card{position:relative;padding:12px;border-radius:14px;background:var(--card);border:2.5px solid var(--line);box-shadow:4px 4px 0 var(--shadow);text-align:left;transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.card:hover{transform:translate(-2px,-4px);box-shadow:7px 9px 0 var(--shadow)}
.card:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.card .cv{width:100%;aspect-ratio:1;border-radius:10px;margin-bottom:12px;border:3px solid #fff;box-shadow:0 0 0 2.5px var(--line);transition:transform .35s var(--ease)}
.card:hover .cv{transform:rotate(-2deg) scale(1.03)}.card:nth-child(even):hover .cv{transform:rotate(2deg) scale(1.03)}
.card .t,.row .t{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb{position:absolute;right:20px;top:calc(100% - 96px);width:46px;height:46px;border-radius:50%;background:var(--cracks),var(--lava);color:#1a1208;border:2.5px solid var(--line);display:grid;place-items:center;opacity:0;transform:translateY(10px) scale(.8);transition:all .3s var(--ease);box-shadow:3px 3px 0 var(--shadow)}
.card:hover .pb,.card:focus-within .pb{opacity:1;transform:none}
.cv{display:grid;place-items:center;font-family:"Russo One",sans-serif;font-size:28px;color:#1a1208;position:relative;overflow:hidden;flex:none}
.cv::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,#ffffff55,transparent 55%);pointer-events:none}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.row{display:grid;grid-template-columns:40px 1fr 1fr 48px;gap:14px;align-items:center;padding:7px 14px;border-radius:12px;width:100%;text-align:left;transition:background .2s,transform .2s var(--ease)}
.row:hover{background:var(--hover)}
.row.cur{background:linear-gradient(90deg,#ff9a0040,transparent 85%);box-shadow:inset 4px 0 0 var(--l3)}
.row .n{color:var(--mute);text-align:center;font-weight:800}
.row .tt{display:flex;gap:12px;align-items:center;min-width:0}
.row .tt .cv{width:44px;height:44px;border-radius:8px;font-size:18px;border:2px solid var(--line)}
.row.cur .t{color:var(--hot)}
.eq{display:none;gap:2px;align-items:flex-end;height:15px;justify-content:center}
.eq i{width:4px;background:linear-gradient(#ffd21f,#ff4a12);height:100%;transform-origin:bottom;animation:eq 1s ease-in-out infinite;animation-play-state:paused;border-radius:1px}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.8s}
.row.cur .eq{display:flex}.row.cur .n span{display:none}
body.playing .eq i{animation-play-state:running}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.hb{width:36px;height:36px;display:grid;place-items:center;color:var(--mute);border-radius:50%;transition:color .2s,transform .2s var(--ease)}
.hb:hover{color:var(--text);transform:scale(1.12)}
.hb.on{color:var(--l3)}.hb.on svg{fill:var(--l3);animation:pop .4s var(--ease)}
@keyframes pop{0%{transform:scale(.5) rotate(-20deg)}60%{transform:scale(1.35) rotate(8deg)}100%{transform:none}}
.em{position:fixed;width:9px;height:9px;z-index:90;pointer-events:none;background:var(--l1);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:em .8s var(--ease) forwards}
@keyframes em{to{transform:translate(var(--dx),var(--dy)) rotate(180deg) scale(.2);opacity:0}}
.hero{display:flex;align-items:flex-end;gap:22px;margin:30px 0 24px}
.hero .cv{width:190px;height:190px;border-radius:14px;border:4px solid #fff;box-shadow:0 0 0 2.5px var(--line),6px 6px 0 2.5px var(--shadow);font-size:64px;background:var(--lava)}
.hero h1{font-size:50px;margin:4px 0 8px}
.big{width:58px;height:58px;border-radius:50%;background:var(--cracks),var(--lava);color:#1a1208;border:2.5px solid var(--line);display:grid;place-items:center;box-shadow:4px 4px 0 var(--shadow);transition:transform .2s var(--ease)}
.big:hover{transform:translate(-1px,-2px) scale(1.05)}.big:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.sb{display:flex;align-items:center;gap:10px;background:var(--card);border:2.5px solid var(--line);box-shadow:4px 4px 0 var(--shadow);border-radius:99px;padding:0 20px;height:50px;max-width:460px;margin:34px 0 22px}
.sb:focus-within{outline:3px solid var(--l3);outline-offset:2px}
.sb input{flex:1;background:none;border:0;color:var(--text);font:inherit;font-weight:700;outline:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
.tile{height:112px;border-radius:14px;padding:14px;font-size:20px;color:#1a1208;text-align:left;position:relative;overflow:hidden;border:2.5px solid var(--line);box-shadow:4px 4px 0 var(--shadow);background-image:var(--cracks);transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.tile:hover{transform:translate(-2px,-3px) rotate(-1deg);box-shadow:7px 8px 0 var(--shadow)}
.tile small{display:block;font-family:Manrope,sans-serif;font-weight:700;font-size:12px;opacity:.8;margin-top:2px}
.btn{background:var(--cracks),var(--lava);color:#1a1208;padding:12px 26px;border-radius:99px;border:2.5px solid var(--line);box-shadow:3px 3px 0 var(--shadow);transition:transform .2s var(--ease)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.empty{padding:50px 0;color:var(--mute);text-align:center;font-weight:700}
.sk{height:236px;border-radius:14px;background:linear-gradient(90deg,var(--hover),var(--card),var(--hover));background-size:200% 100%;animation:sh 1.4s linear infinite;border:2.5px solid var(--line);opacity:.7}
.sk.r{height:58px;margin-bottom:8px;border-radius:12px}
@keyframes sh{to{background-position:-200% 0}}
.tbtn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 30px);right:34px;z-index:6;width:44px;height:44px;border-radius:50%;background:var(--card);color:var(--text);border:2.5px solid var(--line);box-shadow:3px 3px 0 var(--shadow);display:grid;place-items:center;transition:transform .2s var(--ease)}
.tbtn:hover{transform:rotate(20deg) scale(1.08)}.tbtn:active{transform:translate(2px,2px)}
/* player bar */
#bar{--mute:#b6a283;color:#fff1d6;grid-column:1/3;grid-row:2;display:grid;grid-template-columns:1fr 1.5fr 1fr;align-items:center;gap:16px;padding:0 18px;background:var(--barbg);border:2.5px solid var(--line);border-radius:16px;box-shadow:5px 5px 0 var(--shadow),inset 0 4px 0 var(--l2)}
.now{display:flex;gap:12px;align-items:center;min-width:0}
.now .cv{width:58px;height:58px;border-radius:10px;font-size:22px;cursor:pointer;border:2.5px solid #fff;transition:transform .3s var(--ease);background:var(--lava)}
.now .cv:hover{transform:rotate(-4deg) scale(1.06)}
body.playing .now .cv{animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 22px 2px #ff9a0099}}
.now .tx{min-width:0;cursor:pointer}.now .tx div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:6px}
.btns{display:flex;align-items:center;gap:20px}
.ib{color:var(--mute);transition:color .2s,transform .2s var(--ease);padding:4px}.ib:hover{color:#fff1d6;transform:scale(1.12)}
.pp{width:42px;height:42px;border-radius:50%;background:var(--cracks),var(--lava);color:#1a1208;border:2.5px solid #1a1208;display:grid;place-items:center;transition:transform .2s var(--ease)}
.pp:hover{transform:scale(1.1)}.pp:active{transform:scale(.94)}
.seek{display:flex;gap:10px;align-items:center;width:100%;max-width:560px;color:var(--mute);font-size:11px;font-weight:700}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:6px;background:linear-gradient(90deg,#ffd21f,#ff4a12 var(--p,0%),#4a3a28 var(--p,0%));cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;border:2.5px solid #1a1208}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid #1a1208}
.rt{display:flex;justify-content:flex-end;align-items:center;gap:12px}.rt input{max-width:100px;flex:none}
#sl{font-size:11px;font-weight:800}
/* full player */
#full{color:#1a1208;--mute:#4a3314;position:fixed;inset:0;z-index:20;background:var(--bg);transform:translateY(100%);transition:transform .5s var(--ease);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;overflow:hidden}
#full.open{transform:none}
#fbg{position:absolute;inset:0;background:var(--cracks),var(--lava)}
#full>*:not(#fbg){position:relative}
#fcv{width:min(92vw,560px);aspect-ratio:16/9;border-radius:14px;font-size:60px;border:4px solid #fff;box-shadow:0 0 0 2.5px #1a1208,8px 8px 0 3px #1a1208;transform:none!important}
.fi{width:min(92vw,560px)}
.fi h2{margin:0;font-size:26px;text-shadow:2px 0 #fff,-2px 0 #fff,0 2px #fff,0 -2px #fff,2px 2px #fff,-2px -2px #fff,2px -2px #fff,-2px 2px #fff}
#full .a{font-weight:700}
#full .ib{color:#1a1208}#full .ib:hover{color:#000}
#full .pp{background:#1a1208;color:#ffd21f}
#full input[type=range]{background:linear-gradient(90deg,#1a1208 var(--p,0%),#1a120855 var(--p,0%))}
#full input[type=range]::-webkit-slider-thumb{background:#ffd21f}
#full .seek{color:#1a1208}
#full .hb{color:#1a1208}#full .hb.on{color:#fff}#full .hb.on svg{fill:#fff}
#full>.fx{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px}
#ytw{position:fixed;z-index:15;right:30px;bottom:122px;width:320px;height:200px;border-radius:14px;overflow:hidden;background:#000;border:2.5px solid var(--line);box-shadow:5px 5px 0 var(--shadow);display:none}
body.hasvideo #ytw{display:block}
#ytw iframe{width:100%;height:100%;border:0}
#ytw.docked{z-index:25;border-radius:12px;transition:left .45s var(--ease),top .45s var(--ease),width .45s var(--ease),height .45s var(--ease)}
#toast{width:max-content;max-width:90vw;text-align:center;position:fixed;left:50%;bottom:120px;transform:translate(-50%,10px);background:var(--text);color:var(--bg);font-weight:800;padding:11px 22px;border-radius:99px;border:2.5px solid var(--line);opacity:0;transition:all .3s var(--ease);pointer-events:none;z-index:95}
#toast.on{opacity:1;transform:translate(-50%,0)}
#mnav{display:none}

.prof{position:absolute;top:calc(env(safe-area-inset-top,0px) + 30px);right:90px;z-index:6;height:44px;min-width:44px;padding:0;border-radius:99px;background:var(--cracks),var(--lava);color:#1a1208;border:2.5px solid var(--line);box-shadow:3px 3px 0 var(--shadow);display:flex;align-items:center;justify-content:center;gap:8px;font-family:"Russo One",Manrope,sans-serif;font-size:14px;overflow:hidden;transition:transform .2s var(--ease)}
.prof.out{padding:0 16px}
.prof:hover{transform:translate(-1px,-2px)}.prof:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.prof img{width:100%;height:100%;object-fit:cover}
.pmenu{position:absolute;top:calc(env(safe-area-inset-top,0px) + 84px);right:34px;z-index:7;width:270px;padding:16px;background:var(--card);border:2.5px solid var(--line);border-radius:16px;box-shadow:5px 5px 0 var(--shadow);animation:up .3s var(--ease)}
.pmenu .who{font-family:"Russo One",Manrope,sans-serif;font-size:17px;word-break:break-word}
.pmenu .a{margin:2px 0 14px;white-space:normal;word-break:break-all}
.pmenu button{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:10px;font-weight:800}
.pmenu button:hover{background:var(--hover)}
#auth{position:fixed;inset:0;z-index:60;background:#150e06cc;display:none;place-items:center;padding:20px}
#auth.open{display:grid}
.ab{background:var(--card);color:var(--text);border:2.5px solid var(--line);border-radius:18px;box-shadow:7px 7px 0 var(--shadow);padding:26px;width:min(420px,100%);max-height:92vh;overflow:auto;animation:up .35s var(--ease);position:relative}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.ab h2{margin:0 0 6px;font-size:24px}.ab .a{white-space:normal;margin-bottom:16px}
.ab .x{position:absolute;top:12px;right:14px;font-size:26px;line-height:1;color:var(--mute);padding:4px 8px}
.ab input{width:100%;background:var(--bg);border:2.5px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--text);font:inherit;font-weight:700}
.ab .btn,.gbtn{width:100%;text-align:center;font-size:15px;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:10px}
.gbtn{background:#fff;color:#1a1208;padding:12px;border-radius:99px;border:2.5px solid #1a1208;box-shadow:3px 3px 0 #1a1208;font-weight:800;margin-top:0}
.gbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #1a1208}
.or{display:flex;align-items:center;gap:12px;color:var(--mute);font-weight:800;font-size:12px;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:2.5px;background:var(--line);opacity:.25}
.ph{display:grid;grid-template-columns:76px 1fr;gap:10px}
.err{color:var(--hot);font-weight:700;font-size:13px;margin-top:10px;min-height:1em}
.lnk{margin-top:14px;font-weight:800;color:var(--mute);text-decoration:underline;text-underline-offset:3px;display:block}
@media (max-width:820px){.prof{top:calc(env(safe-area-inset-top,0px) + 16px);right:66px;height:40px;min-width:40px}.pmenu{right:14px;top:calc(env(safe-area-inset-top,0px) + 66px)}}
@media (max-width:820px){
 #app{grid-template-columns:1fr;grid-template-rows:1fr auto auto;gap:10px;padding:10px}
 #side{display:none}#main{grid-column:1}
 .in{padding:20px 16px 30px}
 h1{font-size:25px}.hero{flex-direction:column;align-items:flex-start}.hero .cv{width:150px;height:150px}.hero h1{font-size:34px}
 .hero2 h1{font-size:30px}.hero2{padding:22px 18px;margin-top:40px}
 .tbtn{top:calc(env(safe-area-inset-top,0px) + 16px);right:18px;width:40px;height:40px}
 #bar{grid-column:1;grid-row:2;grid-template-columns:1fr auto;padding:8px 12px;height:68px;gap:8px}
 .ctrl .seek,.ctrl .btns .ib,.rt{display:none}
 .ctrl{margin:0}.now .cv{width:46px;height:46px}
 #mnav{display:flex;grid-row:3;justify-content:space-around;padding:6px;background:var(--panel);border:2.5px solid var(--line);border-radius:16px;box-shadow:4px 4px 0 var(--shadow)}
 #mnav .nv{flex-direction:column;gap:2px;font-size:11px;padding:6px 12px;width:auto}
 .row{grid-template-columns:36px 1fr 40px}.row .al{display:none}
 .shelf{grid-auto-columns:146px;gap:14px}.card{padding:9px}.pb{opacity:1;transform:none;width:38px;height:38px;right:14px;top:calc(100% - 82px)}
 #ytw:not(.docked){opacity:0;pointer-events:none;left:0;top:0;right:auto;bottom:auto;width:200px;height:200px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
 <button class="tbtn" id="theme" aria-label="Switch theme"></button>
 <button class="prof" id="prof" aria-label="Account"></button>
 <div class="pmenu" id="pmenu" hidden></div>
 <div id="side">
  <div class="panel" id="nav">
   <div class="logo"><img class="lg" src="assets/logo.png" alt="Songify" width="799" height="360"><i class="spk a"></i><i class="spk b"></i></div>
   <button class="nv on" data-v="home"><span data-i="home"></span>Home</button>
   <button class="nv" data-v="search"><span data-i="search"></span>Search</button>
   <button class="nv" data-v="liked"><span data-i="heart"></span>Liked Songs</button>
   <button class="nv" data-v="queue"><span data-i="queue"></span>Queue</button>
  </div>
  <div class="panel" id="lib"></div>
 </div>
 <div class="panel" id="main"><div class="in" id="in"></div></div>
 <div id="bar">
  <div class="now"><div class="cv" id="ncv" data-open></div><div class="tx" data-open><div id="nt" style="font-weight:700">Pick a song</div><div class="a" id="na">Songify</div></div><button class="hb" id="nh" aria-label="Like"><span data-i="heart"></span></button></div>
  <div class="ctrl">
   <div class="btns"><button class="ib" id="prev" aria-label="Previous"><span data-i="prev"></span></button><button class="pp" id="pp" aria-label="Play or pause"><span data-i="play"></span></button><button class="ib" id="next" aria-label="Next"><span data-i="next"></span></button></div>
   <div class="seek"><span id="cur">0:00</span><input type="range" id="sk" min="0" max="100" value="0" aria-label="Seek"><span id="dur">0:00</span></div>
  </div>
  <div class="rt"><button class="ib" id="sleep" aria-label="Sleep timer" style="display:flex;gap:6px;align-items:center"><span data-i="moon"></span><span id="sl">Off</span></button><span data-i="vol" style="color:var(--mute)"></span><input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume"></div>
 </div>
 <nav id="mnav">
  <button class="nv on" data-v="home"><span data-i="home"></span>Home</button>
  <button class="nv" data-v="search"><span data-i="search"></span>Search</button>
  <button class="nv" data-v="liked"><span data-i="heart"></span>Liked</button>
  <button class="nv" data-v="queue"><span data-i="queue"></span>Queue</button>
 </nav>
</div>
<div id="full">
 <div id="fbg"></div>
 <button class="ib fx" id="fclose" aria-label="Close"><span data-i="down"></span></button>
 <div class="cv" id="fcv"></div>
 <div class="fi"><h2 id="ft">Pick a song</h2><div class="a" id="fa"></div></div>
 <div class="fi"><div class="seek" style="max-width:none"><span id="fcur">0:00</span><input type="range" id="fsk" min="0" max="100" value="0" aria-label="Seek"><span id="fdur">0:00</span></div></div>
 <div class="btns"><button class="ib" id="fprev" aria-label="Previous"><span data-i="prev" data-s="30"></span></button><button class="pp" id="fpp" style="width:64px;height:64px" aria-label="Play or pause"><span data-i="play" data-s="30"></span></button><button class="ib" id="fnext" aria-label="Next"><span data-i="next" data-s="30"></span></button></div>
 <button class="hb" id="fh" aria-label="Like"><span data-i="heart" data-s="26"></span></button>
</div>
<div id="auth"><div class="ab" id="ab"></div></div>
<div id="rc"></div>
<div id="ytw"><div id="ytp"></div></div>
<div id="toast"></div>
<script>
const IC={home:'<path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/>',search:'<circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>',heart:'<path d="M12 20.5C5 15 2.5 12 2.5 8.6 2.5 6 4.5 4 7 4c1.8 0 3.7.9 5 2.7C13.3 4.9 15.2 4 17 4c2.5 0 4.5 2 4.5 4.6 0 3.4-2.5 6.4-9.5 11.9z" fill="none" stroke="currentColor" stroke-width="2"/>',queue:'<path d="M3 6h13M3 11h13M3 16h8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M16 14l5 3-5 3z"/>',play:'<path d="M7 4.5v15l13-7.5z"/>',pause:'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>',next:'<path d="M5 5l11 7-11 7zM17 5h2.5v14H17z"/>',prev:'<path d="M19 5L8 12l11 7zM5 5h2.5v14H5z"/>',moon:'<path d="M20 14.5A8 8 0 119.5 4a6.5 6.5 0 0010.5 10.5z"/>',vol:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 010 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',down:'<path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>'};
IC.user='<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/>';
IC.sun='<circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>';
const svg=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor">${IC[n]}</svg>`;
document.querySelectorAll("[data-i]").forEach(e=>{e.innerHTML=svg(e.dataset.i,+e.dataset.s||(e.closest(".nv")?22:20))});

const MOODS={melody:["Melody","Soft and soulful"],romantic:["Romantic","For two hearts"],kuthu:["Kuthu","Turn it up"],sad:["Sad","Feel it out"],fun:["Fun","Good vibes only"]};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $=id=>document.getElementById(id);
const DB={};const reg=l=>(l||[]).map(s=>(DB[s.id]=Object.assign(DB[s.id]||{},s)));
let uid="",ME=null;const K=k=>k+(uid?":"+uid:"");
let favs=reg(store.get(K("sf_favs"),[])),recent=reg(store.get(K("sf_recent"),[]));
const S={trend:null,shelf:{},rel:{}};let fails=0;
let cur=null,queue=[],stack=[],view="home",moodView=null,q="",player=null,ready=false,playing=false,sleepT=null,pendingId=null,st=null;
const save=()=>{store.set(K("sf_favs"),favs);store.set(K("sf_recent"),recent.slice(0,30))};
const isFav=id=>favs.some(f=>f.id===id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hue=s=>{let h=0;for(const c of (s.title||"")+(s.id||""))h=(h*31+c.charCodeAt(0))%360;return h};
const grad=s=>{const h=hue(s)%36;return `linear-gradient(150deg,hsl(${42-h/2} 100% 58%),hsl(${14+h/2} 95% 48%))`};
const toast=m=>{const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2600)};
const fmt=t=>{t=Math.floor(t||0);return Math.floor(t/60)+":"+String(t%60).padStart(2,"0")};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const cv=(s,cls="")=>`<div class="cv ${cls}" style="background:${grad(s)}">${s.thumb?`<img src="${esc(s.thumb)}" alt="" loading="lazy" onerror="this.remove()">`:""}${esc((s.title||"♪")[0])}</div>`;
async function api(p){const r=await fetch(p);let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||"Search service is unavailable");return j}

/* youtube player (visible, as YouTube's policies require) */
window.onYouTubeIframeAPIReady=()=>{player=new YT.Player("ytp",{width:"100%",height:"100%",playerVars:Object.assign({playsinline:1,rel:0,modestbranding:1},/^https?:/.test(location.protocol)?{origin:location.origin}:{}),events:{onReady:()=>{ready=true;player.setVolume(+$("vol").value);if(pendingId){player.loadVideoById(pendingId);pendingId=null}},onStateChange:e=>{if(e.data===1)fails=0;if(e.data===0)next();setPlaying(e.data===1)},onError:e=>{if(e.data===153){toast("Player setup problem (error 153). Open Songify from its https:// web address, not from a saved file.");return}if(++fails<=3){toast("The owner doesn’t allow this video here. Skipping to the next song.");next()}else{fails=0;toast("Several videos failed. Try searching a different song.")}}}})};
(function(){const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";s.onerror=()=>toast("Couldn’t load the YouTube player. Check your connection.");document.head.appendChild(s)})();
function setPlaying(p){playing=p;document.body.classList.toggle("playing",p);$("pp").innerHTML=svg(p?"pause":"play",20);$("fpp").innerHTML=svg(p?"pause":"play",30)}
function dock(){const w=$("ytw"),f=$("full");if(f.classList.contains("open")){const r=$("fcv").getBoundingClientRect(),dy=f.getBoundingClientRect().top;Object.assign(w.style,{left:r.left+"px",top:(r.top-dy)+"px",width:r.width+"px",height:r.height+"px",right:"auto",bottom:"auto"});w.classList.add("docked")}else{w.removeAttribute("style");w.classList.remove("docked")}}
const openFull=()=>{if(!cur)return;$("full").classList.add("open");requestAnimationFrame(dock);setTimeout(dock,480)};
const closeFull=()=>{$("full").classList.remove("open");dock()};
addEventListener("resize",dock);

function paintNow(){
 const s=cur;if(!s)return;
 $("nt").textContent=$("ft").textContent=s.title;$("na").textContent=$("fa").textContent=s.artist;
 const inner=(s.thumb?`<img src="${esc(s.thumb)}" alt="">`:"")+esc(s.title[0]);
 $("ncv").style.background=$("fcv").style.background=grad(s);$("ncv").innerHTML=$("fcv").innerHTML=inner;
 [$("nh"),$("fh")].forEach(b=>b.classList.toggle("on",isFav(s.id)));
 document.title=s.title+" · Songify";
}
function play(s,fresh=true){
 cur=s;recent=[s,...recent.filter(x=>x.id!==s.id)].slice(0,30);stack.push(s.id);save();
 document.body.classList.add("hasvideo");
 if(ready)player.loadVideoById(s.id);else pendingId=s.id;
 paintNow();if(fresh)buildQueue();
 if("mediaSession" in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:s.artist,artwork:s.thumb?[{src:s.thumb}]:[]});navigator.mediaSession.setActionHandler("nexttrack",next);navigator.mediaSession.setActionHandler("previoustrack",prev)}
 render(true);
}
/* same-feel queue: same mood shelf if known, else more songs from the same channel */
async function buildQueue(){
 const s=cur;let pool=[];
 if(s.mood&&S.shelf[s.mood])pool=S.shelf[s.mood];
 else{const k=s.artist;if(!S.rel[k]){try{S.rel[k]=reg((await api("/api/search?q="+encodeURIComponent(k+" tamil songs"))).items)}catch(e){S.rel[k]=[]}}pool=S.rel[k]}
 if(cur!==s)return;
 const r=recent.slice(0,8).map(x=>x.id);
 queue=shuffle(pool.filter(x=>x.id!==s.id&&!r.includes(x.id))).slice(0,12);
 if(!queue.length&&S.trend)queue=shuffle(S.trend.filter(x=>x.id!==s.id)).slice(0,12);
 if(view==="queue")render();
}
async function next(){if(!queue.length)await buildQueue();const s=queue.shift();if(s){const k=queue.slice();play(s,false);queue=k;if(queue.length<3)buildQueue()}}
function prev(){stack.pop();const id=stack.pop();if(id&&DB[id])play(DB[id]);else if(cur)player&&player.seekTo(0)}
function toggle(){if(!cur)return toast("Pick a song first");if(ready)playing?player.pauseVideo():player.playVideo()}
function fav(id){const s=DB[id];if(!s)return;favs=isFav(id)?favs.filter(f=>f.id!==id):[s,...favs];save();if(cur)paintNow();render(true)}
$("pp").onclick=$("fpp").onclick=toggle;$("next").onclick=$("fnext").onclick=next;$("prev").onclick=$("fprev").onclick=prev;
$("nh").onclick=$("fh").onclick=e=>{if(!cur)return;if(!isFav(cur.id))ember(e.clientX,e.clientY);fav(cur.id)};
document.querySelectorAll("[data-open]").forEach(e=>e.onclick=openFull);$("fclose").onclick=closeFull;
const seekTo=e=>{if(ready&&cur)player.seekTo(player.getDuration()*e.target.value/100,true)};
$("sk").oninput=$("fsk").oninput=seekTo;
$("vol").oninput=e=>{e.target.style.setProperty("--p",e.target.value+"%");if(ready)player.setVolume(+e.target.value)};$("vol").style.setProperty("--p","80%");
setInterval(()=>{if(ready&&cur&&player.getDuration){const d=player.getDuration()||0,t=player.getCurrentTime()||0,p=d?t/d*100:0;["","f"].forEach(x=>{$(x+"cur").textContent=fmt(t);$(x+"dur").textContent=fmt(d);$(x+"sk").value=p;$(x+"sk").style.setProperty("--p",p+"%")})}},400);
$("sleep").onclick=()=>{const o=[0,15,30,60],m=o[(o.indexOf(+$("sleep").dataset.m||0)+1)%4];$("sleep").dataset.m=m;clearTimeout(sleepT);$("sl").textContent=m?m+"m":"Off";if(m){sleepT=setTimeout(()=>{try{player.pauseVideo()}catch(e){}$("sl").textContent="Off";$("sleep").dataset.m=0;toast("Sleep timer ended")},m*60000);toast("Sleep timer set for "+m+" min")}else toast("Sleep timer off")};

/* views */
const card=s=>`<div class="card" data-p="${s.id}" tabindex="0" role="button">${cv(s)}<div class="t">${esc(s.title)}</div><div class="a">${esc(s.artist)}</div><span class="pb">${svg("play",20)}</span></div>`;
const row=(s,i)=>`<div class="row ${cur&&cur.id===s.id?"cur":""}" data-p="${s.id}" tabindex="0" role="button"><div class="n"><span>${i+1}</span><div class="eq"><i></i><i></i><i></i></div></div><div class="tt">${cv(s)}<div style="min-width:0"><div class="t">${esc(s.title)}</div><div class="a">${esc(s.artist)}</div></div></div><div class="a al">${s.mood&&MOODS[s.mood]?MOODS[s.mood][0]:"Tamil"}</div><button class="hb ${isFav(s.id)?"on":""}" data-f="${s.id}" aria-label="Like">${svg("heart",18)}</button></div>`;
const list=l=>l.map(row).join("");
const skel=n=>Array.from({length:n},()=>'<div class="sk"></div>').join("");
const skelRows=n=>Array.from({length:n},()=>'<div class="sk r"></div>').join("");
const err=m=>`<div class="empty">${esc(m)}<br><button class="btn" data-retry style="margin-top:14px">Try again</button></div>`;
const greet=()=>{const h=new Date().getHours();return h<12?"Good morning":h<18?"Good afternoon":"Good evening"};
const LIKEG="linear-gradient(160deg,#ffd21f,#ff9a00 45%,#ff4a12)";

async function loadShelf(m){
 if(S.shelf[m])return S.shelf[m];
 const l=reg((await api("/api/search?q="+encodeURIComponent("tamil "+m+" songs"))).items).map(s=>Object.assign(s,{mood:m}));
 return S.shelf[m]=l;
}
async function loadHome(){
 const t=$("sh-trend");
 if(!S.trend){try{S.trend=reg((await api("/api/trending")).items)}catch(e){if(view==="home"&&$("sh-trend"))$("sh-trend").outerHTML=`<div class="a" style="white-space:normal;padding:6px 0 16px">${esc(e.message)} <button class="btn" data-retry style="padding:6px 16px;font-size:13px;margin-left:8px">Try again</button></div>`;return}}
 if(view==="home"&&$("sh-trend"))$("sh-trend").innerHTML=S.trend.map(card).join("");
 for(const m of Object.keys(MOODS)){
  try{const l=await loadShelf(m);if(view==="home"&&$("sh-"+m))$("sh-"+m).innerHTML=l.slice(0,12).map(card).join("")}catch(e){if($("sh-"+m))$("sh-"+m).innerHTML='<div class="a">Couldn’t load this shelf.</div>'}
 }
}
function render(soft){
 document.querySelectorAll(".nv").forEach(n=>n.classList.toggle("on",n.dataset.v===view));
 $("lib").innerHTML=`<h3>Your library</h3>`+[...favs,...recent.filter(r=>!isFav(r.id))].slice(0,8).map(s=>`<button class="li" data-p="${s.id}">${cv(s)}<div style="min-width:0"><div class="t" style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.title)}</div><div class="a">${isFav(s.id)?"Liked":"Recent"}</div></div></button>`).join("")+(favs.length||recent.length?"":`<div class="yb" style="padding-top:0">Songs you play and like show up here.</div>`)+`<div class="yb">Videos play via YouTube</div>`;
 if(soft&&(view==="home"||view==="search"))return softPaint();
 let h="";
 if(view==="home"){
  h=`<div class="hero2"><div class="hi">${greet()}</div><h1>Tamil songs, endless.</h1><p>Search any song. Your queue keeps the same feel.</p><i class="spk a"></i><i class="spk b"></i><i class="spk c"></i></div><div class="quick"><button class="qk" data-v2="liked"><div class="cv" style="background:${LIKEG};height:56px">${svg("heart",24)}</div>Liked Songs</button>${Object.keys(MOODS).map(m=>`<button class="qk" data-mood="${m}"><div class="cv" style="background:${grad({title:m})};height:56px">${MOODS[m][0][0]}</div>${MOODS[m][0]}</button>`).join("")}</div><h2>Trending in Tamil</h2><div class="shelf" id="sh-trend">${S.trend?S.trend.map(card).join(""):skel(6)}</div>`+Object.keys(MOODS).map(m=>`<h2>${MOODS[m][0]}</h2><div class="shelf" id="sh-${m}">${S.shelf[m]?S.shelf[m].slice(0,12).map(card).join(""):skel(6)}</div>`).join("");
  $("in").innerHTML=h;loadHome();return;
 }
 if(view==="search"){
  h=`<h1>Search</h1><label class="sb">${svg("search",20)}<input id="sr" placeholder="Any Tamil song, singer or movie" value="${esc(q)}" autocomplete="off"></label><div id="res"></div>`;
  $("in").innerHTML=h;paintRes();return;
 }
 if(view==="mood"){
  h=`<div class="hero"><div class="cv" style="background:${grad({title:moodView})}">${MOODS[moodView][0][0]}</div><div><div class="a">Mood</div><h1>${MOODS[moodView][0]}</h1><div class="a" style="margin-bottom:14px">${MOODS[moodView][1]}</div><button class="big" id="pm" aria-label="Play">${svg("play",26)}</button></div></div><div id="ml">${S.shelf[moodView]?list(S.shelf[moodView]):skelRows(8)}</div>`;
  $("in").innerHTML=h;const mv=moodView;if(!S.shelf[mv])loadShelf(mv).then(l=>{if(view==="mood"&&moodView===mv)$("ml").innerHTML=list(l)}).catch(e=>{if($("ml"))$("ml").innerHTML=err(e.message)});return;
 }
 if(view==="liked"){
  h=`<div class="hero"><div class="cv" style="background:${LIKEG}">${svg("heart",70)}</div><div><div class="a">Playlist</div><h1>Liked Songs</h1><div class="a">${favs.length} songs</div></div></div>`+(favs.length?list(favs):`<div class="empty">Songs you like will appear here.<br>Tap the heart on any song.</div>`);
 }
 if(view==="queue"){
  h=`<h1>Queue</h1>`+(cur?`<h2 style="margin-top:0;font-size:16px;color:var(--mute)">Now playing</h2>${list([cur])}<h2 style="font-size:16px;color:var(--mute)">Next up, matched to this song’s feel</h2>${queue.length?list(queue):skelRows(5)}`:`<div class="empty">Play a song and your queue builds itself.</div>`);
 }
 $("in").innerHTML=h;
}
function softPaint(){document.querySelectorAll(".card,.row").forEach(el=>{const id=el.dataset.p;if(el.classList.contains("row"))el.classList.toggle("cur",!!cur&&cur.id===id);const b=el.querySelector("[data-f]");if(b)b.classList.toggle("on",isFav(b.dataset.f))})}
let res=null;
function paintRes(){const r=$("res");if(!r)return;if(!q.trim()){r.innerHTML=`<h2 style="margin-top:0">Browse by mood</h2><div class="tiles">${Object.keys(MOODS).map(m=>`<button class="tile" data-mood="${m}" style="background:${grad({title:m})}">${MOODS[m][0]}<small>${MOODS[m][1]}</small></button>`).join("")}</div>`;return}
 if(res&&res.q===q)r.innerHTML=res.err?err(res.err):(res.items.length?list(res.items):`<div class="empty">No results for “${esc(q)}”.<br>Try another name.</div>`);else r.innerHTML=skelRows(8)}
async function doSearch(term){
 try{const items=reg((await api("/api/search?q="+encodeURIComponent(term))).items);res={q:term,items}}catch(e){res={q:term,err:e.message}}
 if(view==="search"&&q===term)paintRes();
}
document.body.addEventListener("input",e=>{if(e.target.id==="sr"){q=e.target.value;clearTimeout(st);paintRes();if(q.trim().length>=2)st=setTimeout(()=>doSearch(q),450)}});
document.body.addEventListener("click",e=>{
 const nv=e.target.closest(".nv");if(nv){view=nv.dataset.v;closeFull();render();$("main").scrollTo(0,0);if(view==="search")setTimeout(()=>$("sr")&&$("sr").focus(),50);return}
 const f=e.target.closest("[data-f]");if(f){if(!isFav(f.dataset.f))ember(e.clientX,e.clientY);return fav(f.dataset.f)}
 const p=e.target.closest("[data-p]");if(p){const s=DB[p.dataset.p];if(!s)return;if(view==="queue"&&queue.includes(s)){const k=queue.slice(queue.indexOf(s)+1);play(s,false);queue=k}else play(s);return}
 const m=e.target.closest("[data-mood]");if(m){moodView=m.dataset.mood;view="mood";render();$("main").scrollTo(0,0);return}
 const l=e.target.closest("[data-v2]");if(l){view=l.dataset.v2;render();return}
 if(e.target.closest("#pm")){loadShelf(moodView).then(l=>l[0]&&play(l[0])).catch(x=>toast(x.message))}
 if(e.target.closest("[data-retry]")){if(view==="search"&&q){res=null;paintRes();doSearch(q)}else{S.trend=null;render()}}
});
document.body.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.p)e.target.click();if(e.key==="Escape")closeFull()});

/* sparks when you like a song */
function ember(x,y){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;for(let i=0;i<9;i++){const s=document.createElement("i");s.className="em";const a=Math.PI*2*i/9+Math.random()*.5,d=26+Math.random()*30;s.style.left=x-4+"px";s.style.top=y-4+"px";s.style.setProperty("--dx",Math.cos(a)*d+"px");s.style.setProperty("--dy",Math.sin(a)*d+"px");document.body.appendChild(s);setTimeout(()=>s.remove(),900)}}
/* theme */
function paintTheme(){const d=document.documentElement.dataset.theme==="dark";$("theme").innerHTML=svg(d?"sun":"moon",20);const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=d?"#0d0803":"#ebe8dd"}
$("theme").onclick=()=>{const t=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=t;store.set("sf_theme",t);paintTheme()};
paintTheme();

/* account: Firebase login (configured in firebase-config.js) */
const NOAUTH="Login isn’t switched on yet. Add your Firebase keys in firebase-config.js (steps are in the README).";
const GIC='<svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.800 2.400 30.300 0 24 0 14.600 0 6.500 5.400 2.600 13.200l7.900 6.100C12.400 13.600 17.700 9.500 24 9.500z"/><path fill="#4285F4" d="M46.500 24.500c0-1.600-.1-3.100-.4-4.500H24v9h12.700c-.6 3-2.300 5.500-4.800 7.200l7.600 5.900c4.400-4.100 7-10.100 7-17.600z"/><path fill="#FBBC05" d="M10.500 28.700A14.500 14.500 0 019.500 24c0-1.600.3-3.200.8-4.700l-7.900-6.100A24 24 0 000 24c0 3.900.9 7.500 2.600 10.800l7.900-6.100z"/><path fill="#34A853" d="M24 48c6.500 0 11.900-2.100 15.900-5.800l-7.600-5.900c-2.100 1.400-4.900 2.300-8.300 2.300-6.300 0-11.600-4.100-13.500-9.800l-7.900 6.100C6.500 42.600 14.600 48 24 48z"/></svg>';
const who=u=>u?(u.name||u.email||u.phone||"Listener"):"";
function paintProfile(){
 const b=$("prof");$("pmenu").hidden=true;
 if(ME){b.className="prof";b.innerHTML=ME.photo?`<img src="${esc(ME.photo)}" alt="" referrerpolicy="no-referrer">`:esc(who(ME).replace("+","")[0].toUpperCase());b.setAttribute("aria-label","Account: "+who(ME))}
 else{b.className="prof out";b.innerHTML=svg("user",18)+"<span>Sign in</span>";b.setAttribute("aria-label","Sign in")}
}
window.sfAuthChange=u=>{ME=u;uid=u?u.uid:"";favs=reg(store.get(K("sf_favs"),[]));recent=reg(store.get(K("sf_recent"),[]));paintProfile();render();if(u)closeAuth()};
function closeAuth(){$("auth").classList.remove("open")}
function openAuth(step,msg){
 const a=$("ab");
 if(step==="otp")a.innerHTML=`<button class="x" id="aclose" aria-label="Close">×</button><h2>Enter the code</h2><p class="a">We sent a 6-digit code to ${esc(msg)}.</p><input id="aotp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"><button class="btn" id="averify">Verify and sign in</button><div class="err" id="aerr"></div><a class="lnk" id="achange" href="#" role="button">Use a different number</a>`;
 else a.innerHTML=`<button class="x" id="aclose" aria-label="Close">×</button><h2>Sign in to Songify</h2><p class="a">Keep your likes and recent songs with your account. You can also keep listening without one.</p><button class="gbtn" id="ag">${GIC}Continue with Google</button><div class="or">OR USE YOUR MOBILE NUMBER</div><div class="ph"><input id="acc" value="+91" aria-label="Country code" inputmode="tel"><input id="aph" inputmode="tel" autocomplete="tel-national" placeholder="Mobile number"></div><button class="btn" id="asend">Send OTP</button><div class="err" id="aerr">${msg?esc(msg):""}</div>`;
 $("auth").classList.add("open");setTimeout(()=>{const i=$("aph")||$("aotp");i&&i.focus()},60);
}
const aerr=m=>{const e=$("aerr");if(e)e.textContent=m};
const friendly=e=>{const c=(e&&e.code)||"";return c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request"?"":c==="auth/invalid-phone-number"?"Check the mobile number and country code.":c==="auth/too-many-requests"?"Too many tries. Please wait a few minutes.":c==="auth/invalid-verification-code"?"That code is wrong. Try again.":c==="auth/code-expired"?"That code expired. Send a new one.":c==="auth/unauthorized-domain"?"This website isn’t allowed yet. Add it in Firebase, Authentication, Settings, Authorized domains.":c==="auth/operation-not-allowed"?"This sign-in method is off. Turn it on in Firebase, Authentication, Sign-in method.":(e&&e.message)||"Something went wrong. Try again."};
const AU=()=>window.sfAuthApi&&window.sfAuthApi.ready?window.sfAuthApi:null;
$("prof").onclick=()=>{
 if(!ME)return openAuth();
 const m=$("pmenu");if(!m.hidden){m.hidden=true;return}
 m.innerHTML=`<div class="who">${esc(ME.name||"Your account")}</div><div class="a">${esc(ME.email||ME.phone||"")}</div><button id="asw">Switch account</button><button id="aout">Sign out</button>`;m.hidden=false;
};
document.addEventListener("click",async e=>{
 const id=e.target.closest("[id]")&&e.target.closest("[id]").id;
 if(!e.target.closest("#pmenu")&&!e.target.closest("#prof"))$("pmenu").hidden=true;
 if(e.target===$("auth")||id==="aclose")return closeAuth();
 if(id==="ag"){const A=AU();if(!A)return aerr(NOAUTH);try{await A.google()}catch(x){aerr(friendly(x))}}
 if(id==="asend"){const A=AU();if(!A)return aerr(NOAUTH);const n=$("aph").value.replace(/\D/g,""),c="+"+$("acc").value.replace(/\D/g,"");if(n.length<6)return aerr("Enter your mobile number.");$("asend").disabled=true;aerr("");try{await A.sendCode(c+n);openAuth("otp",c+" "+n)}catch(x){aerr(friendly(x));const b=$("asend");if(b)b.disabled=false}}
 if(id==="averify"){const A=AU();const v=$("aotp").value.trim();if(v.length<6)return aerr("Enter the 6-digit code.");$("averify").disabled=true;try{await A.verify(v)}catch(x){aerr(friendly(x));const b=$("averify");if(b)b.disabled=false}}
 if(id==="achange"){e.preventDefault();openAuth()}
 if(id==="aout"){$("pmenu").hidden=true;const A=AU();if(A)await A.out();toast("Signed out")}
 if(id==="asw"){$("pmenu").hidden=true;const A=AU();if(A)await A.out();openAuth()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeAuth();$("pmenu").hidden=true}if(e.key==="Enter"&&e.target.id==="aph")$("asend").click();if(e.key==="Enter"&&e.target.id==="aotp")$("averify").click()});
paintProfile();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
setPlaying(false);render();
</script>
<script src="firebase-config.js"></script>
<script type="module">
const cfg=window.FIREBASE_CONFIG;
window.sfAuthApi={ready:false};
if(cfg&&cfg.apiKey){
 try{
  const V="10.12.2",B="https://www.gstatic.com/firebasejs/"+V+"/";
  const [{initializeApp},A]=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js")]);
  const auth=A.getAuth(initializeApp(cfg)),api=window.sfAuthApi;
  api.google=()=>{const p=new A.GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});return A.signInWithPopup(auth,p)};
  api.sendCode=async phone=>{try{if(!api.rv)api.rv=new A.RecaptchaVerifier(auth,"rc",{size:"invisible"});api.conf=await A.signInWithPhoneNumber(auth,phone,api.rv)}catch(e){try{api.rv&&api.rv.clear()}catch(x){}api.rv=null;throw e}};
  api.verify=c=>api.conf.confirm(c);
  api.out=()=>A.signOut(auth);
  api.ready=true;
  A.onAuthStateChanged(auth,u=>window.sfAuthChange(u&&{uid:u.uid,name:u.displayName,email:u.email,phone:u.phoneNumber,photo:u.photoURL}));
 }catch(e){console.error(e)}
}
</script>
